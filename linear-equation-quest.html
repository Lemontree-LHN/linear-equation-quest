function open(i){let x=B[bi][1][i];type=x[2];let d=I[type];work.innerHTML=`<article class="panel lesson"><span class="tag">${B[bi][0]} · ${x[1]}</span><h2>${x[0]}</h2><p class="muted">${d[0]}</p><h3>关键规则</h3><ul class="keys">${d[1].split('；').map(z=>'<li>'+z+'</li>').join('')}</ul><h3>例题讲解</h3><div class="example">${d[2]}</div><div class="demo"><div class="bar"><b>动态演示</b><input id="range" type="range" min="-5" max="8" value="3"></div><canvas id="cv" width="700" height="280"></canvas></div></article><section class="panel"><h2>随机练习</h2><div class="question" id="question"></div><input class="answer" id="answer" placeholder="输入答案或关键词"><div class="actions"><button class="btn hint" id="hint">提示</button><button class="btn primary" id="check">提交</button><button class="btn" id="next">换一题</button></div><div class="feedback" id="feedback">先独立思考，需要时查看提示。</div><h3>本专题错题</h3><div id="wrong" class="muted"></div></section>`;newQ();draw(3);range.oninput=e=>draw(+e.target.value);check.onclick=judge;hint.onclick=()=>feedback.innerHTML='<b>提示：</b>'+Q.h;next.onclick=newQ;answer.onkeydown=e=>{if(e.key=='Enter')judge()};wrong.innerHTML=S.wrong.filter(z=>z.t==type).slice(0,3).map(z=>`${z.q}<br><b>答案：${z.a}</b><hr>`).join('')||'暂无错题';side.classList.remove('open')}
function newQ(){let a=R(2,9),b=R(1,9),x=R(1,8),q,a0,h,e;const simple={solid:['正方体有多少条棱？','12','按上、下、竖直三组数。'],data:['了解全校学生睡眠时间，应选普查还是抽样调查？','抽样调查','人数很多，要兼顾成本。'],parallel:['同位角相等，两直线是什么关系？','平行','这是平行线判定。'],symmetry:[`点(${a},${b})关于y轴的对称点？`,`-${a},${b}`,'横坐标变号。'],probability:['掷骰子出现偶数的概率？','1/2','有利结果有2、4、6。'],real:['√2是有理数还是无理数？','无理数','它是无限不循环小数。'],proof:['“两直线平行，同位角相等”是判定还是性质？','性质','已知平行，推出角关系。'],congruence:['直角三角形斜边和一条直角边对应相等，使用什么判定？','HL','直角三角形特有判定。'],parallelogram:['平行四边形对角线有什么关系？','互相平分','不一定相等或垂直。'],specialquad:['对角线相等且互相平分的四边形是？','矩形','先判定平行四边形。'],probability2:['抛两枚硬币，恰一枚正面的概率？','1/2','列出四种等可能结果。'],projection:['竖直圆柱的俯视图是什么？','圆','从正上方观察。'],trig:['对边3、邻边4，tan等于？','3/4','tan=对边/邻边。'],stats2:['200件中4件次品，次品率？','2%','次品数除以总数。']};if(simple[type]){[q,a0,h]=simple[type];e=I[type][2]}else if(type=='equation'){q=`${a}x+${b}=${a*x+b}，x=?`;a0=x;h='先减常数，再除以系数。';e=`${a}x=${a*x}，x=${x}` }else if(type=='system'){q=`x+y=${a+b}，x-y=${a-b}，求x`;a0=a;h='两式相加消去y。';e=`2x=${2*a}，x=${a}` }else if(type=='quadraticEq'){q=`x²-${a+b}x+${a*b}=0，较小根？`;a0=Math.min(a,b);h='寻找和与积。';e=`(x-${a})(x-${b})=0` }else if(type=='pythagoras'){let z=[[3,4,5],[5,12,13]][R(0,1)];q=`直角边${z[0]}、${z[1]}，斜边？`;a0=z[2];h='a²+b²=c²';e=`${z[0]}²+${z[1]}²=${z[2]}²`}else if(type=='triangle'||type=='line'){q=`三角形两角${a*5}°、${b*5}°，第三角？`;a0=180-a*5-b*5;h='内角和180°';e=`180-${a*5}-${b*5}=${a0}°`}else if(type=='factor'){q=`x²-${a*a}分解因式`;a0=`(x+${a})(x-${a})`;h='平方差公式';e=`x²-${a}²=(x+${a})(x-${a})`}else if(type=='linear'||type=='relation'||type=='inverse'||type=='quadraticFn'){if(type=='inverse'){q=`y=${a*b}/x，x=${a}时y=?`;a0=b;h='代入y=k/x'}else if(type=='quadraticFn'){q=`y=(x-${a})²+2的顶点？`;a0=`${a},2`;h='顶点式(h,k)'}else{q=`y=${a}x+${b}，x=${x}时y=?`;a0=a*x+b;h='代入x'}e=I[type][2]}else if(type=='inequality'){q=`-${a}x>${a*x}，解集？`;a0=`x<-${x}`;h='除以负数要变号';e=`x<-${x}`}else if(type=='similarity'){q=`相似比1:${a}，面积比？`;a0=`1:${a*a}`;h='面积比等于相似比平方';e=`1:${a*a}`}else if(type=='circle'){q=`半径${a}，直径？`;a0=2*a;h='直径是半径2倍';e=`2×${a}=${2*a}`}else if(type=='coordinate'||type=='transform'){q=`点(${a},${b})向右平移3单位后的坐标？`;a0=`${a+3},${b}`;h='只增加横坐标';e=`(${a+3},${b})`}else if(type=='fraction'){q=`1/x=1/${a}，x=?`;a0=a;h='交叉相乘并检验';e=`x=${a}`}else if(type=='algebra'){q=`${a}x+${b}x=?x`;a0=a+b;h='合并系数';e=`(${a}+${b})x=${a+b}x`}else if(type=='powers'){q=`a^${a}·a^${b}=a^?`;a0=a+b;h='指数相加';e=`${a}+${b}=${a+b}`}else if(type=='stats'){let n=[a,b,x,5];q=`${n.join('、')}的平均数？`;a0=n.reduce((s,v)=>s+v,0)/4;h='总和除以4';e=`答案${a0}`}else{q=`${a}+(${-b})=?`;a0=a-b;h='加负数等于减正数';e=`答案${a0}`}Q={q,a:String(a0),h,e};question.textContent=q;answer.value='';feedback.className='feedback';feedback.textContent='先独立思考，需要时查看提示。'}
function N(s){return s.trim().replace(/[（）()，,\s]/g,'').replace(/−/g,'-').toLowerCase()}function judge(){if(!answer.value.trim())return;let ok=N(answer.value)==N(Q.a)||(!isNaN(+answer.value)&&!isNaN(+Q.a)&&Math.abs(+answer.value-+Q.a)<1e-8);S.tries++;if(ok){S.ok++;if(!S.done.includes(type))S.done.push(type);feedback.className='feedback good';feedback.innerHTML='<b>正确！</b><br>'+Q.e}else{S.wrong.unshift({t:type,q:Q.q,a:Q.a});S.wrong=S.wrong.slice(0,30);feedback.className='feedback bad';feedback.innerHTML=`<b>再检查一次</b><br>答案：${Q.a}<br>${Q.e}`}save();nav()}
function draw(v){let c=cv.getContext('2d'),w=cv.width,h=cv.height;c.clearRect(0,0,w,h);c.strokeStyle='#ddd';for(let x=0;x<w;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke()}c.strokeStyle='#17212b';c.lineWidth=3;if(['linear','inverse','quadraticFn','relation','coordinate'].includes(type)){c.beginPath();c.moveTo(20,h/2);c.lineTo(w-20,h/2);c.moveTo(w/2,10);c.lineTo(w/2,h-10);c.stroke();c.strokeStyle='#d7493e';c.lineWidth=5;c.beginPath();for(let p=30;p<w-20;p+=3){let X=(p-w/2)/40,Y=type=='quadraticFn'?(X-v/3)**2-2:type=='inverse'?(v||1)/(X||.1):v/3*X,py=h/2-Y*30;if(py>-30&&py<h+30){p==30?c.moveTo(p,py):c.lineTo(p,py)}}c.stroke()}else if(['triangle','pythagoras','trig','similarity','congruence'].includes(type)){c.strokeStyle='#2464a8';c.lineWidth=5;c.beginPath();c.moveTo(120,230);c.lineTo(350+v*10,230);c.lineTo(120,55);c.closePath();c.stroke()}else if(type=='circle'){c.strokeStyle='#d7493e';c.lineWidth=5;c.beginPath();c.arc(w/2,h/2,70+v*5,0,7);c.stroke()}else if(['solid','projection'].includes(type)){c.strokeStyle='#2464a8';c.lineWidth=4;c.strokeRect(220,80,130,130);c.strokeRect(270,40,130,130);[[220,80,270,40],[350,80,400,40],[220,210,270,170],[350,210,400,170]].forEach(p=>{c.beginPath();c.moveTo(p[0],p[1]);c.lineTo(p[2],p[3]);c.stroke()})}else{c.beginPath();c.moveTo(30,h/2);c.lineTo(w-30,h/2);c.stroke();for(let n=-8;n<=8;n++){let x=w/2+n*35;c.beginPath();c.moveTo(x,h/2-7);c.lineTo(x,h/2+7);c.stroke()}c.fillStyle='#d7493e';c.beginPath();c.arc(w/2+v*35,h/2,10,0,7);c.fill()}}
document.onclick=e=>{let b=e.target.closest('[data-b]'),t=e.target.closest('[data-t]');if(b){bi=+b.dataset.b;nav()}if(t)open(+t.dataset.t)};search.oninput=e=>{let q=e.target.value;if(!q)return nav();let all=B.flatMap((b,i)=>b[1].map((x,j)=>({x,i,j}))).filter(z=>(z.x[0]+z.x[1]).includes(q));grid.innerHTML=all.map(z=>`<button class="card" data-g="${z.i},${z.j}"><span class="tag">${B[z.i][0]}</span><h3>${z.x[0]}</h3><p>${z.x[1]}</p></button>`).join('');document.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>{[bi,j]=x.dataset.g.split(',').map(Number);nav();open(j)})};menu.onclick=()=>side.classList.toggle('open');nav();save();open(0);

const baseNewQ=newQ;
newQ=function(){baseNewQ();if(level==='challenge'){const hard={equation:['3(x−2)+5=2x+12，x=?','13','先去括号，再合并同类项。','3x−6+5=2x+12，x=13'],system:['2x+y=11，x−y=1，求x','4','先把两式相加消去y。','3x=12，所以x=4，y=3'],rational:['(−3)²−5×(−2)=?','19','先算乘方和乘法，再做减法。','9+10=19'],triangle:['等腰三角形顶角40°，每个底角是多少？','70','两个底角相等，三角形内角和180°。','(180−40)÷2=70°'],linear:['一次函数y=2x−3，当x=5时y=?','7','把x=5代入函数关系式。','y=2×5−3=7'],quadraticEq:['x²−7x+12=0，较大的根？','4','寻找和为7、积为12的两个数。','(x−3)(x−4)=0，较大根为4'],inequality:['−3x+5≤14，解集？','x≥-3','先减5，再除以−3，注意不等号变向。','−3x≤9，所以x≥−3'],similarity:['相似比2:3，面积比是多少？','4:9','面积比是相似比的平方。','2²:3²=4:9']}[type];if(hard){Q={q:hard[0],a:hard[1],h:hard[2],e:hard[3]};question.textContent=Q.q;answer.value='';feedback.className='feedback';feedback.textContent='挑战题：先写出关键步骤，再输入最终答案。'}};
function decorateLesson(){const lesson=document.querySelector('.lesson'),panel=document.querySelector('.work section.panel');if(!lesson||!panel||lesson.dataset.decorated)return;const detail=DETAIL[type];if(detail)lesson.insertAdjacentHTML('afterbegin',`<div class="notice"><b>知识点清单：</b>${detail[0]} · ${detail[1]}<br><b>易错提醒：</b>${detail[2]}</div>`);const h=panel.querySelector('h2');h.insertAdjacentHTML('afterend','<div class="levels" aria-label="练习难度"><button data-level="basic" class="active">基础</button><button data-level="medium">提高</button><button data-level="challenge">挑战</button></div>');panel.querySelectorAll('[data-level]').forEach(btn=>btn.onclick=()=>{level=btn.dataset.level;panel.querySelectorAll('[data-level]').forEach(x=>x.classList.toggle('active',x===btn));newQ()});lesson.dataset.decorated='1'}
